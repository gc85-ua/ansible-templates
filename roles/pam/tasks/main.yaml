---
- name: Ensure google-authenticator is installed
  ansible.builtin.package:
    name: libpam-google-authenticator
    state: present
- name: Ensure pam_google_authenticator.so is placed directly after common-auth
  ansible.builtin.lineinfile:
    path: /etc/pam.d/sshd
    regexp: ^#?\s*auth\s+.*\s+pam_google_authenticator\.so
    line: auth required pam_google_authenticator.so nullok
    insertafter: ^@?include\s+common-auth\b
    state: present
